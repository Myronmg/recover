<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>Recover</title>
<style>
:root{--bg:#0b0d10;--card:#14171c;--line:#23272e;--txt:#e8eaed;--mut:#8b929c;--acc:#4ade80;--blue:#60a5fa;--warn:#fbbf24;--red:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.stat b{display:block;font-size:17px}.stat span{font-size:12px;color:var(--mut)}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.mut{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
input,select,textarea,button{font:inherit;color:inherit}
input,select{width:100%;background:#0f1216;border:1px solid var(--line);border-radius:10px;padding:10px}
button{background:var(--acc);color:#06130a;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
button.g{background:var(--line);color:var(--txt)}
.list>div{padding:10px 0;border-top:1px solid var(--line)}.list>div:first-child{border-top:0}
.chip{display:inline-block;padding:6px 10px;border-radius:20px;background:var(--line);margin:0 6px 6px 0;font-size:13px}
.chip.on{background:var(--acc);color:#06130a;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f1216ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:13px 0;font-size:13px;font-weight:500}
nav button.on{color:var(--acc)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:6px}label input,label select{margin-top:4px;font-size:15px;color:var(--txt)}
.bars{display:flex;align-items:flex-end;gap:6px;height:100px}.bars div{flex:1;text-align:center;font-size:10px;color:var(--mut)}.bars i{display:block;border-radius:4px 4px 0 0;margin-bottom:4px}
.x{background:none;color:var(--red);padding:4px 8px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const K='recover_v1';
const D={profile:{sex:'m',age:18,weight:75,height:180,goal:'bulk',act:1.6,wake:'06:30',cycle:90,lat:15,needH:8.5,ppk:2},log:{},foods:[],garmin:null};
let S;try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){S={}}
S={...D,...S,profile:{...D.profile,...(S.profile||{})}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let tab='heute',day=iso(new Date()),planBed=null,RES=[];
const r=Math.round;
const toM=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const hm=m=>{m=((r(m)%1440)+1440)%1440;return String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dur=m=>m==null?'–':`${Math.floor(m/60)}h ${String(r(m%60)).padStart(2,'0')}`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=d=>new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const G=()=>(S.garmin?.days||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
const gDay=d=>G().find(x=>x.date===d);
const st=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`;

/* ---------- Rechner ---------- */
function nutrition(d){
  const p=S.profile,w=+p.weight,today=iso(new Date());
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const full=G().filter(x=>x.date<today&&x.kcalTotal>0).slice(-7);
  const avgT=avg(full.map(x=>x.kcalTotal)),avgA=avg(full.map(x=>x.kcalActive||0));
  let tdee,src;
  if(avgT){tdee=avgT;src=`Ø Garmin, ${full.length} Tage`;const t=gDay(d);if(t?.kcalActive>avgA){tdee+=t.kcalActive-avgA;src+=' + Extra-Training'}}
  else{tdee=bmr*p.act;src='Grundumsatz × Aktivität'}
  const kcal=r(tdee+{bulk:300,maintain:0,cut:-400}[p.goal]);
  const prot=r(w*p.ppk),fat=r(w*.9),carb=Math.max(0,r((kcal-prot*4-fat*9)/4));
  const L=S.log[d]||[],eat=k=>r(L.reduce((s,x)=>s+(+x[k]||0),0));
  return{bmr:r(bmr),tdee:r(tdee),src,kcal,prot,fat,carb,e:{kcal:eat('kcal'),p:eat('p'),c:eat('c'),f:eat('f')},L};
}
function sleep(){
  const p=S.profile,nights=G().filter(x=>x.sleepMin).slice(-7),last=nights[nights.length-1];
  const need=last?.needMin||p.needH*60;
  const debt=nights.reduce((s,x)=>s+Math.max(0,(x.needMin||p.needH*60)-x.sleepMin),0);
  const extra=Math.min(45,r(debt/4)),want=need+extra,cyc=+p.cycle,lat=+p.lat,W=toM(p.wake);
  let n=Math.max(4,Math.round(want/cyc));if(n*cyc<want-30)n++;
  const opts=[n-1,n,n+1].map(k=>({k,bed:W-lat-k*cyc,sl:k*cyc}));
  const now=new Date(),nowM=now.getHours()*60+now.getMinutes();
  const wakes=[4,5,6,7].map(k=>({k,t:nowM+lat+k*cyc}));
  return{nights,last,need,debt,extra,want,opts,wakes,W,cyc,lat};
}

/* ---------- Views ---------- */
const mbar=(l,e,t,c)=>`<div class="row mut" style="margin-top:6px"><span>${l}</span><span>${e} / ${t} g</span></div><div class="bar"><i style="width:${Math.min(100,t?e/t*100:0)}%;background:${c}"></i></div>`;
const lastNight=L=>`<div class="card"><h2>Letzte Nacht · ${fmtD(L.date)}</h2><div class="grid">
${st(L.score??'–','Sleep Score')}${st(dur(L.sleepMin),'Schlaf')}${st(L.bed&&L.wake?L.bed+'–'+L.wake:'–','Zeitraum')}
${st(dur(L.deepMin),'Tiefschlaf')}${st(dur(L.remMin),'REM')}${st(L.hrv??'–','HRV (ms)')}
${st(L.rhr??'–','Ruhepuls')}${st(L.bb??'–','Body Battery')}${st(L.steps??'–','Schritte')}</div></div>`;

function vHeute(){
  const t=iso(new Date()),n=nutrition(t),s=sleep(),rest=n.kcal-n.e.kcal,rec=s.opts[1];
  return`<h1>${fmtD(t)}</h1>
<div class="card"><h2>Kalorien</h2><div class="row"><div><div class="big">${Math.abs(rest)}</div><div class="mut">${rest>=0?'kcal übrig':'kcal über Ziel'}</div></div><div style="text-align:right"><div><b>${n.e.kcal}</b> / ${n.kcal}</div><div class="mut">gegessen / Ziel</div></div></div>
<div class="bar"><i style="width:${Math.min(100,n.e.kcal/n.kcal*100)}%"></i></div>
${mbar('Protein',n.e.p,n.prot,'var(--acc)')}${mbar('Carbs',n.e.c,n.carb,'var(--blue)')}${mbar('Fett',n.e.f,n.fat,'var(--warn)')}
<div class="mut" style="margin-top:8px">Verbrauch ${n.tdee} kcal (${n.src})</div></div>
<div class="card"><h2>Heute Nacht</h2><div class="row"><div><div class="big">${hm(rec.bed)}</div><div class="mut">ins Bett</div></div><div style="text-align:right"><div class="big" style="font-size:28px">${S.profile.wake}</div><div class="mut">Wecker · ${rec.k} Zyklen</div></div></div>
<div class="mut" style="margin-top:8px">Bedarf ${dur(s.need)}${s.debt>30?` · Schlafschuld ${dur(s.debt)} → +${s.extra} min`:''}</div></div>
${s.last?lastNight(s.last):`<div class="card"><h2>Garmin</h2><div class="mut">Noch keine Garmin-Daten – unter „Garmin“ garmin.json importieren.</div></div>`}`;
}

function vEssen(){
  const n=nutrition(day);
  return`<div class="row" style="margin-bottom:12px"><button class="g" onclick="shift(-1)">‹</button><h1 style="margin:0">${day===iso(new Date())?'Heute':fmtD(day)}</h1><button class="g" onclick="shift(1)">›</button></div>
<div class="card"><div class="row"><div><b>${n.e.kcal}</b> / ${n.kcal} kcal</div><div class="mut">P ${n.e.p}/${n.prot} · C ${n.e.c}/${n.carb} · F ${n.e.f}/${n.fat}</div></div><div class="bar"><i style="width:${Math.min(100,n.e.kcal/n.kcal*100)}%"></i></div></div>
<div class="card"><h2>Suchen (Name oder Barcode)</h2><div class="row"><input id="q" placeholder="z.B. Skyr, Haferflocken, 4061458…" onkeydown="if(event.key==='Enter')search()"><button onclick="search()">Los</button></div><div id="res" class="list" style="margin-top:8px"></div>
${S.foods.length?`<div style="margin-top:10px">${S.foods.slice(0,14).map((f,i)=>`<span class="chip" onclick="quick(${i})">+ ${esc(f.name.split(' · ')[0])}${f.per?` ${f.g}g`:''}</span>`).join('')}</div>`:''}</div>
<div class="card"><h2>Manuell</h2><input id="mn" placeholder="Name" style="margin-bottom:6px"><div class="f4"><input id="mk" type="number" inputmode="decimal" placeholder="kcal"><input id="mp" type="number" inputmode="decimal" placeholder="P"><input id="mc" type="number" inputmode="decimal" placeholder="C"><input id="mf" type="number" inputmode="decimal" placeholder="F"></div><button style="margin-top:8px;width:100%" onclick="manual()">Hinzufügen</button></div>
<div class="card"><h2>Gegessen</h2><div class="list">${n.L.length?n.L.map(x=>`<div class="row"><div><div>${esc(x.name)}${x.g?` <span class="mut">${x.g}g</span>`:''}</div><div class="mut">${r(x.kcal)} kcal · P ${r(x.p)} · C ${r(x.c)} · F ${r(x.f)}</div></div><button class="x" onclick="del(${x.id})">✕</button></div>`).join(''):'<div class="mut">Noch nichts eingetragen.</div>'}</div></div>`;
}

function vSchlaf(){
  const s=sleep(),p=S.profile,B=planBed??hm(s.opts[1].bed);
  const start=toM(B)+s.lat,diff=((s.W-start)%1440+1440)%1440,k=Math.max(1,Math.floor(diff/s.cyc)),best=start+k*s.cyc;
  const max=Math.max(540,...s.nights.map(x=>x.sleepMin));
  return`<h1>Schlaf</h1>
<div class="card"><h2>Bedarf</h2><div class="grid">${st(dur(s.need),s.last?.needMin?'Garmin-Bedarf':'Standard')}${st(dur(s.debt),'Schuld 7 Tage')}${st(dur(s.want),'Ziel heute')}</div></div>
<div class="card"><h2>Wann ins Bett? (Wecker ${p.wake})</h2><div class="list">${s.opts.map((o,i)=>`<div class="row"><div><b style="font-size:20px;${i===1?'color:var(--acc)':''}">${hm(o.bed)}</b> <span class="mut">${o.k} Zyklen · ${dur(o.sl)}</span></div>${i===1?'<span class="chip on">Empfohlen</span>':''}</div>`).join('')}</div><div class="mut" style="margin-top:6px">inkl. ${s.lat} min Einschlafzeit</div></div>
<div class="card"><h2>Perfekter Aufwach-Moment</h2><label>Ich gehe ins Bett um<input type="time" value="${B}" onchange="planBed=this.value;render()"></label>
<div class="row" style="margin-top:6px"><div><div class="big">${hm(best)}</div><div class="mut">Ende Zyklus ${k} · ${dur(k*s.cyc)} Schlaf</div></div><div style="text-align:right"><b>${hm(best-15)}–${hm(Math.min(best+15,start+diff))}</b><div class="mut">Smart-Wake-Fenster</div></div></div>
<div class="mut" style="margin-top:8px">Am Zyklusende bist du im Leichtschlaf → wachst fitter auf. Hat deine Garmin Smart Wake: Fenster dort eintragen, sonst Wecker auf ${hm(best)}.</div></div>
<div class="card"><h2>Jetzt schlafen → aufwachen um</h2>${s.wakes.map(w=>`<span class="chip">${hm(w.t)} · ${w.k} Zyklen</span>`).join('')}</div>
${s.nights.length?`<div class="card"><h2>Letzte Nächte (grün = Bedarf erreicht)</h2><div class="bars">${s.nights.map(x=>`<div><i style="height:${x.sleepMin/max*70}px;background:${x.sleepMin>=(x.needMin||p.needH*60)?'var(--acc)':'var(--warn)'}"></i>${(x.sleepMin/60).toFixed(1)}<br>${new Date(x.date+'T12:00').toLocaleDateString('de-DE',{weekday:'short'})}</div>`).join('')}</div></div>`:''}
<div class="card"><h2>Einstellungen</h2><div class="f2"><label>Wecker<input type="time" value="${p.wake}" onchange="setP('wake',this.value)"></label><label>Einschlafzeit (min)<input type="number" value="${p.lat}" onchange="setP('lat',this.value)"></label><label>Zykluslänge (min)<input type="number" value="${p.cycle}" onchange="setP('cycle',this.value)"></label><label>Schlafbedarf ohne Garmin (h)<input type="number" step=".25" value="${p.needH}" onchange="setP('needH',this.value)"></label></div></div>`;
}

function vSetup(){
  const p=S.profile,g=S.garmin;
  const sel=(k,o)=>`<select onchange="setP('${k}',this.value)">${o.map(([v,l])=>`<option value="${v}" ${p[k]==v?'selected':''}>${l}</option>`).join('')}</select>`;
  const num=(k,l,step='1')=>`<label>${l}<input type="number" inputmode="decimal" step="${step}" value="${p[k]}" onchange="setP('${k}',this.value)"></label>`;
  return`<h1>Garmin & Profil</h1>
<div class="card"><h2>Garmin-Sync</h2><div class="mut" style="margin-bottom:10px">${g?`Letzter Sync: ${esc(g.synced)} · ${g.days.length} Tage`:'Noch keine Daten.'}</div>
<label>Sync-Passwort (= SYNC_PASS auf GitHub)<input id="pw" type="password" value="${esc(S.pass||'')}"></label>
<button style="width:100%" onclick="S.pass=document.getElementById('pw').value;save();sync(true)">Speichern & Daten laden</button>
<label style="margin-top:12px">Oder garmin.json manuell importieren<input type="file" accept=".json,application/json" onchange="importFile(this,'garmin')"></label></div>
<div class="card"><h2>Profil</h2><div class="f2"><label>Geschlecht${sel('sex',[['m','männlich'],['w','weiblich']])}</label>${num('age','Alter')}${num('weight','Gewicht (kg)','.1')}${num('height','Größe (cm)')}<label>Ziel${sel('goal',[['bulk','Muskelaufbau +300'],['maintain','Halten'],['cut','Definieren −400']])}</label>${num('ppk','Protein (g/kg)','.1')}<label>Aktivität ohne Garmin${sel('act',[[1.4,'wenig'],[1.6,'mittel'],[1.8,'viel'],[2,'sehr viel']])}</label></div></div>
<div class="card"><h2>Backup</h2><div class="row"><button class="g" onclick="exportAll()">Exportieren</button><label style="margin:0;flex:1">Importieren<input type="file" accept=".json" onchange="importFile(this,'all')"></label></div></div>`;
}

/* ---------- Aktionen ---------- */
function render(){
  document.getElementById('nav').innerHTML=[['heute','Heute'],['essen','Essen'],['schlaf','Schlaf'],['setup','Garmin']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  document.getElementById('app').innerHTML={heute:vHeute,essen:vEssen,schlaf:vSchlaf,setup:vSetup}[tab]();
}
function go(t){tab=t;if(t==='heute')day=iso(new Date());render();scrollTo(0,0)}
function setP(k,v){S.profile[k]=['sex','goal','wake'].includes(k)?v:+v;save();render()}
function push(e){(S.log[day]=S.log[day]||[]).push({id:Date.now(),...e});save();render()}
function remember(f){S.foods=[f,...S.foods.filter(x=>x.name!==f.name)].slice(0,30)}
const fromPer=(name,per,g)=>({name,g,kcal:per.kcal*g/100,p:per.p*g/100,c:per.c*g/100,f:per.f*g/100});
function addRes(i){const x=RES[i],g=+document.getElementById('g'+i).value||100;remember({name:x.name,per:x.per,g});push(fromPer(x.name,x.per,g))}
function quick(i){const f=S.foods[i];remember(f);push(f.per?fromPer(f.name,f.per,f.g):{name:f.name,...f.abs})}
function manual(){const v=id=>+document.getElementById(id).value||0,name=document.getElementById('mn').value.trim()||'Eintrag',abs={kcal:v('mk'),p:v('mp'),c:v('mc'),f:v('mf')};if(!abs.kcal)return;remember({name,abs});push({name,...abs})}
function del(id){S.log[day]=(S.log[day]||[]).filter(x=>x.id!==id);save();render()}
function shift(k){const d=new Date(day+'T12:00');d.setDate(d.getDate()+k);day=iso(d);render()}
async function search(){
  const q=document.getElementById('q').value.trim(),out=document.getElementById('res');if(!q)return;
  out.innerHTML='<div class="mut">Suche…</div>';
  const F='fields=product_name,brands,nutriments';
  try{
    let prods;
    if(/^\d{8,14}$/.test(q)){const j=await(await fetch(`https://world.openfoodfacts.org/api/v2/product/${q}.json?${F}`)).json();prods=j.product?[j.product]:[]}
    else{const j=await(await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&${F}`)).json();prods=j.products||[]}
    RES=prods.map(p=>{const n=p.nutriments||{};return{name:(p.product_name||'?')+(p.brands?' · '+p.brands.split(',')[0]:''),per:{kcal:+n['energy-kcal_100g']||r((+n.energy_100g||0)/4.184),p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0}}}).filter(x=>x.per.kcal>0).slice(0,12);
    out.innerHTML=RES.length?RES.map((x,i)=>`<div class="row"><div style="flex:1"><div>${esc(x.name)}</div><div class="mut">${r(x.per.kcal)} kcal · ${r(x.per.p)} g P / 100 g</div></div><input id="g${i}" type="number" inputmode="decimal" value="100" style="width:72px"><button onclick="addRes(${i})">+</button></div>`).join(''):'<div class="mut">Nichts gefunden – unten manuell eintragen.</div>';
  }catch(e){out.innerHTML='<div class="mut">Suche gerade nicht erreichbar.</div>'}
}
function importFile(inp,kind){
  const f=inp.files[0];if(!f)return;
  f.text().then(t=>{try{const j=JSON.parse(t);
    if(kind==='garmin'){if(!Array.isArray(j.days))throw 0;S.garmin=j}
    else S={...D,...j,profile:{...D.profile,...(j.profile||{})}};
    save();render();alert('Importiert ✓')}catch(e){alert('Ungültige Datei')}});
}
function exportAll(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='recover-backup.json';a.click()}
async function decrypt(o,pass){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(o.salt),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(o.iv)},key,b(o.data))));
}
async function sync(manual){
  if(!S.pass)return;
  try{const o=await(await fetch('garmin.enc.json?t='+Date.now(),{cache:'no-store'})).json();S.garmin=await decrypt(o,S.pass);save();render();if(manual)alert('Garmin aktualisiert ✓')}
  catch(e){if(manual)alert('Sync fehlgeschlagen – Passwort prüfen oder Action noch nicht gelaufen')}
}
render();sync();
</script>
</body>
</html>
